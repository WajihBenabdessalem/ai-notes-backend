[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-notes-backend"
version = "0.1.0"
description = "Backend IA (résumé, recherche sémantique, chat) pour une app de notes iOS."
authors = [{ name = "Wajih Benabdessalem", email = "wajih.abdes@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` in argument defaults is the idiomatic pattern, not a real bug.
"src/notes_backend/api/main.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
